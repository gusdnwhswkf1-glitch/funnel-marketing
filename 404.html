<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 | 분양퍼널</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--blue:#4176B5;--blue-deep:#2B5183;--ink:#0E1114;--grey:#59616A;--grey2:#848C94;--line:#E2E6EB;--soft:#EFF2F5}
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;display:grid;place-items:center;padding:32px;background:#fff;color:var(--ink);
  font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;word-break:keep-all;position:relative}
.bp{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(to right,var(--soft) 1px,transparent 1px),linear-gradient(to bottom,var(--soft) 1px,transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(ellipse 80% 70% at 50% 45%,#000 25%,transparent 100%)}
.box{position:relative;text-align:center;max-width:480px}
.logo{display:inline-flex;align-items:baseline;font-weight:800;font-size:19px;letter-spacing:-.02em;margin-bottom:44px}
.logo .dot{width:6px;height:6px;border-radius:50%;background:var(--blue);margin-left:4px;transform:translateY(-8px)}
.logo .mk{font-family:'IBM Plex Mono',monospace;font-weight:400;font-size:12px;letter-spacing:.07em;color:var(--grey2);margin-left:8px}
.code{font-family:'IBM Plex Mono',monospace;font-size:13px;letter-spacing:.18em;color:var(--blue);font-weight:500;margin-bottom:16px}
h1{font-size:clamp(24px,5vw,34px);font-weight:800;letter-spacing:-.04em;line-height:1.3;margin-bottom:16px}
p{font-size:15.5px;color:var(--grey);line-height:1.8;margin-bottom:34px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;padding:14px 26px;border-radius:2px;border:1px solid transparent;
  font-size:15px;font-weight:700;letter-spacing:-.01em;text-decoration:none;transition:.2s}
.p{background:var(--blue);color:#fff;box-shadow:0 10px 26px -12px rgba(65,118,181,.75)}
.p:hover{background:var(--blue-deep);transform:translateY(-2px)}
.g{background:#fff;color:var(--ink);border-color:var(--line)}
.g:hover{border-color:var(--ink);transform:translateY(-2px)}
</style>
</head>
<body>
<div class="bp"></div>
<div class="box">
  <div class="logo">분양퍼널<span class="dot"></span><span class="mk">BUNYANG FUNNEL</span></div>
  <div class="code">ERROR 404</div>
  <h1>페이지를 찾을 수 없습니다</h1>
  <p>주소가 바뀌었거나 삭제된 페이지입니다.<br>급하시면 바로 전화 주셔도 됩니다.</p>
  <div class="btns">
    <a href="/" class="btn p">홈으로 가기</a>
    <a href="tel:01089812510" class="btn g">010-8981-2510</a>
  </div>
</div>
</body>
</html>
